name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting (if available)
        run: npm run lint || echo "No linting script found"
        continue-on-error: true

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            test-results/
            coverage/
          retention-days: 7

  security-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate || echo "Security vulnerabilities found"
        continue-on-error: true

  build-and-verify:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/index.js" ]; then
            echo "Build failed: dist/index.js not found"
            exit 1
          fi
          echo "Build verification successful"

      - name: Create .env for production test
        run: |
          cp .env.example .env
          echo "PORT=3000" >> .env
          echo "DB_PATH=./test.db" >> .env
          echo "JWT_SECRET=test-secret-key-for-ci-cd-pipeline-min-32-chars" >> .env
          echo "EXAM_TOKEN_SECRET=test-exam-token-secret-min-32-chars" >> .env

      - name: Start server and health check
        run: |
          npm run start &
          sleep 5
          curl -f http://localhost:3000/api/health || exit 1
        env:
          PORT: 3000
          DB_PATH: ./test.db
          JWT_SECRET: test-secret-key-for-ci-cd-pipeline-min-32-chars
          EXAM_TOKEN_SECRET: test-exam-token-secret-min-32-chars
