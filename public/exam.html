<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: white;
      --border: #dce1e8;
      --primary: #3498db;
      --danger: #e74c3c;
      --success: #27ae60;
      --text: #2c3e50;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .container { max-width: 700px; margin: 0 auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    h1, h2 { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; }
    input { width: 100%; padding: 10px; margin-bottom: 16px; border: 1px solid var(--border); border-radius: 6px; }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: white;
      font-size: 16px;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #timer {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      padding: 10px;
      background: #fdf0d5;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .question-block {
      margin-bottom: 20px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafbfc;
    }
    .options label { display: block; margin: 8px 0; font-weight: normal; }
    .hidden { display: none; }
    .error { color: var(--danger); }
    .score { font-size: 20px; text-align: center; margin: 20px 0; }
    .info { font-size: 14px; color: #666; margin-bottom: 10px; }
  </style>
</head>
<body>
<div class="container" id="app">
  <!-- START SCREEN / AUTH SCREENS -->
  <div id="startScreen" class="card">
    <h1 id="examTitle">Loading...</h1>
    <p id="examInfo"></p>
    <div id="authSection"></div>
    <p class="error" id="startError"></p>
    <button id="startBtn" onclick="proceedToStart()" disabled>Start Exam</button>
    <p style="margin-top:12px;"><a href="teacher.html">Teacher Panel</a></p>
  </div>

  <!-- EXAM SCREEN -->
  <div id="examScreen" class="hidden">
    <div id="timer">00:00</div>
    <div id="questionsContainer"></div>
    <button id="submitBtn" onclick="submitExam()">Submit Exam</button>
    <p class="error" id="examError"></p>
  </div>

  <!-- RESULT SCREEN -->
  <div id="resultScreen" class="hidden card">
    <h2>Exam Submitted</h2>
    <div class="score" id="resultText"></div>
    <button onclick="window.location.reload()">Take Another Exam</button>
  </div>
</div>

<script type="module" src="/exam/app.js"></script>
</body>
</html>
