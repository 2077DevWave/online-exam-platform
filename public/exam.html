<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: white;
      --border: #dce1e8;
      --primary: #3498db;
      --danger: #e74c3c;
      --success: #27ae60;
      --text: #2c3e50;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .container { max-width: 700px; margin: 0 auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    h1, h2 { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; }
    input { width: 100%; padding: 10px; margin-bottom: 16px; border: 1px solid var(--border); border-radius: 6px; }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: white;
      font-size: 16px;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #timer {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      padding: 10px;
      background: #fdf0d5;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .question-block {
      margin-bottom: 20px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafbfc;
    }
    .options label { display: block; margin: 8px 0; font-weight: normal; }
    .hidden { display: none; }
    .error { color: var(--danger); }
    .score { font-size: 20px; text-align: center; margin: 20px 0; }
    .info { font-size: 14px; color: #666; margin-bottom: 10px; }
  </style>
</head>
<body>
<div class="container" id="app">
  <!-- START SCREEN / AUTH SCREENS -->
  <div id="startScreen" class="card">
    <h1 id="examTitle">Loading...</h1>
    <p id="examInfo"></p>
    <div id="authSection"></div>
    <p class="error" id="startError"></p>
    <button id="startBtn" onclick="proceedToStart()" disabled>Start Exam</button>
    <p style="margin-top:12px;"><a href="teacher.html">Teacher Panel</a></p>
  </div>

  <!-- EXAM SCREEN -->
  <div id="examScreen" class="hidden">
    <div id="timer">00:00</div>
    <div id="questionsContainer"></div>
    <button id="submitBtn" onclick="submitExam()">Submit Exam</button>
    <p class="error" id="examError"></p>
  </div>

  <!-- RESULT SCREEN -->
  <div id="resultScreen" class="hidden card">
    <h2>Exam Submitted</h2>
    <div class="score" id="resultText"></div>
    <button onclick="window.location.reload()">Take Another Exam</button>
  </div>
</div>

<script>
  const API = '/api';
  const pathParts = window.location.pathname.split('/');
  const examId = parseInt(pathParts[pathParts.length - 1]);

  if (!examId || isNaN(examId)) {
    document.getElementById('startScreen').innerHTML = '<h2>Invalid exam link</h2>';
  }

  let exam = null;
  let examToken = null;     // token for password/student auth
  let timerInterval = null;
  let startTime = null;
  let timeLeft = 0;
  let shuffledQuestions = [];

  async function loadExam() {
    try {
      const res = await fetch(`${API}/public/exams/${examId}`);
      if (!res.ok) {
        if (res.status === 403) {
          const err = await res.json();
          document.getElementById('startScreen').innerHTML = `<h2>${err.error}</h2>`;
          return;
        }
        document.getElementById('startScreen').innerHTML = '<h2>Exam not found or not published</h2>';
        return;
      }
      exam = await res.json();
      document.getElementById('examTitle').textContent = exam.title;
      document.getElementById('examInfo').textContent =
        `${exam.questions.length} questions · ${exam.duration_minutes} minutes`;

      // Build auth section based on exam settings
      const authDiv = document.getElementById('authSection');
      authDiv.innerHTML = '';

      if (exam.has_password || exam.require_student_auth) {
        // Need authentication
        if (exam.has_password && !exam.require_student_auth) {
          authDiv.innerHTML = `
            <div class="info">This exam is password-protected.</div>
            <input type="password" id="examPassword" placeholder="Enter exam password">
            <button onclick="authenticatePassword()">Verify Password</button>
            <p id="passwordError" class="error"></p>
          `;
        } else if (exam.require_student_auth) {
          authDiv.innerHTML = `
            <div class="info">Please login with your student credentials.</div>
            <input type="text" id="studentIdInput" placeholder="Student ID">
            <input type="password" id="studentPasswordInput" placeholder="Password">
            <button onclick="authenticateStudent()">Login</button>
            <p id="studentLoginError" class="error"></p>
          `;
        }
        // startBtn remains disabled until authentication succeeds
      } else {
        // No auth required, show optional name/id fields
        if (exam.require_name) {
          authDiv.innerHTML += `
            <div>
              <label>Your Name</label>
              <input type="text" id="studentName" placeholder="Enter your name">
            </div>
          `;
        }
        if (exam.require_student_id) {
          authDiv.innerHTML += `
            <div>
              <label>Student ID</label>
              <input type="text" id="studentId" placeholder="Enter your student ID">
            </div>
          `;
        }
        document.getElementById('startBtn').disabled = false;
      }
    } catch (err) {
      document.getElementById('startScreen').innerHTML = '<h2>Error loading exam</h2>';
    }
  }

  async function authenticatePassword() {
    const password = document.getElementById('examPassword').value;
    const errorEl = document.getElementById('passwordError');
    try {
      const res = await fetch(`${API}/public/exams/${examId}/verify-password`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({password})
      });
      const data = await res.json();
      if (!res.ok) { errorEl.textContent = data.error || 'Wrong password'; return; }
      examToken = data.token;
      // After password auth, still need name/id if required
      const authDiv = document.getElementById('authSection');
      authDiv.innerHTML = '';
      if (exam.require_name) {
        authDiv.innerHTML += `<div><label>Your Name</label><input type="text" id="studentName" placeholder="Enter your name"></div>`;
      }
      if (exam.require_student_id) {
        authDiv.innerHTML += `<div><label>Student ID</label><input type="text" id="studentId" placeholder="Enter your student ID"></div>`;
      }
      document.getElementById('startBtn').disabled = false;
      errorEl.textContent = '';
    } catch (err) { errorEl.textContent = 'Network error'; }
  }

  async function authenticateStudent() {
    const student_id = document.getElementById('studentIdInput').value.trim();
    const password = document.getElementById('studentPasswordInput').value;
    const errorEl = document.getElementById('studentLoginError');
    if (!student_id || !password) { errorEl.textContent = 'Please fill both fields.'; return; }
    try {
      const res = await fetch(`${API}/public/exams/${examId}/student-login`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({student_id, password})
      });
      const data = await res.json();
      if (!res.ok) { errorEl.textContent = data.error || 'Invalid credentials'; return; }
      examToken = data.token;
      // Student ID may be used for submission, already known
      const authDiv = document.getElementById('authSection');
      authDiv.innerHTML = '';
      // If exam requires name, still ask
      if (exam.require_name) {
        authDiv.innerHTML += `<div><label>Your Name</label><input type="text" id="studentName" placeholder="Enter your name"></div>`;
      }
      // student_id is already known from login, we'll use it later
      document.getElementById('startBtn').disabled = false;
      errorEl.textContent = '';
    } catch (err) { errorEl.textContent = 'Network error'; }
  }

  async function checkAlreadySubmitted() {
    const name = document.getElementById('studentName')?.value.trim() || '';
    const studentId = document.getElementById('studentId')?.value || document.getElementById('studentIdInput')?.value || '';
    try {
      const res = await fetch(`${API}/public/exams/${examId}/already-submitted?name=${encodeURIComponent(name)}&student_id=${encodeURIComponent(studentId)}`);
      if (!res.ok) return false;
      const data = await res.json();
      return data.submitted === true;
    } catch (err) { return false; }
  }

  async function proceedToStart() {
    // if already submitted check
    if (!exam.allow_multiple_submissions) {
      const already = await checkAlreadySubmitted();
      if (already) {
        document.getElementById('startError').textContent = 'You have already submitted this exam and cannot take it again.';
        document.getElementById('startBtn').disabled = true;
        return;
      }
    }

    // Prepare shuffled questions if needed
    shuffledQuestions = [...exam.questions];
    if (exam.shuffle_questions) {
      // Fisher-Yates shuffle
      for (let i = shuffledQuestions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledQuestions[i], shuffledQuestions[j]] = [shuffledQuestions[j], shuffledQuestions[i]];
      }
    }

    // Build questions HTML with shuffled options
    let html = '';
    shuffledQuestions.forEach((q, idx) => {
      const options = [
        { key: 'A', text: q.option_a },
        { key: 'B', text: q.option_b },
        { key: 'C', text: q.option_c },
        { key: 'D', text: q.option_d }
      ];
      if (exam.shuffle_options) {
        for (let i = options.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [options[i], options[j]] = [options[j], options[i]];
        }
      }
      html += `<div class="question-block">
        <p><strong>${idx + 1}. ${q.text}</strong></p>
        <div class="options">
          ${options.map(opt => `
            <label>
              <input type="radio" name="q_${q.id}" value="${opt.key}">
              ${opt.key}) ${opt.text}
            </label>
          `).join('')}
        </div>
      </div>`;
    });
    document.getElementById('questionsContainer').innerHTML = html;

    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('examScreen').classList.remove('hidden');

    timeLeft = exam.duration_minutes * 60;
    startTime = new Date().toISOString();
    updateTimerDisplay();
    timerInterval = setInterval(() => {
      timeLeft--;
      updateTimerDisplay();
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        submitExam();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    document.getElementById('timer').textContent =
      `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
    if (timeLeft < 60) document.getElementById('timer').style.background = '#f8d7da';
  }

  async function submitExam() {
    if (timerInterval) clearInterval(timerInterval);
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;

    const answers = shuffledQuestions.map(q => {
      const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
      return { question_id: q.id, selected_option: selected ? selected.value : null };
    });

    // Determine student name/id from UI or token
    let student_name = document.getElementById('studentName')?.value || null;
    let student_id = document.getElementById('studentId')?.value || document.getElementById('studentIdInput')?.value || null;

    const payload = {
      exam_id: examId,
      student_name,
      student_id,
      started_at: startTime,
      answers,
      exam_token: examToken   // if null, backend will handle accordingly
    };

    try {
      const res = await fetch(`${API}/submissions`, {
        method:'POST',
        headers:{'Content-Type':'application/json', 'Authorization': examToken ? `Bearer ${examToken}` : undefined},
        body:JSON.stringify(payload)
      });
      if (!res.ok) {
        const err = await res.json();
        document.getElementById('examError').textContent = 'Submission failed: ' + (err.error || 'Unknown error');
        submitBtn.disabled = false;
        return;
      }
      const result = await res.json();
      document.getElementById('examScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.remove('hidden');
      document.getElementById('resultText').textContent =
        `Your score: ${result.score.toFixed(1)}% (${Math.round(result.score * result.total_questions / 100)} / ${result.total_questions})`;
    } catch (err) {
      document.getElementById('examError').textContent = 'Network error, please try again.';
      submitBtn.disabled = false;
    }
  }

  loadExam();
</script>
</body>
</html>
