<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/exam/style.css">
</head>
<body>
<div class="container" id="app">

  <!-- HEADER -->
  <div class="exam-header" id="examHeader">
    <h1 id="examTitle">Loading exam...</h1>
    <div class="exam-meta" id="examMeta"></div>
  </div>

  <!-- START SCREEN -->
  <div id="startScreen" class="card">
    <div id="authSection" class="auth-section"></div>
    <p class="error" id="startError"></p>
    <button id="startBtn" class="btn btn-primary btn-block btn-lg" onclick="proceedToStart()" disabled>
      Start Exam
    </button>
  </div>

  <!-- EXAM SCREEN -->
  <div id="examScreen" class="hidden">
    <!-- Timer -->
    <div id="timer" class="timer-bar timer-normal">
      <span>⏱ Time Remaining</span>
      <span id="timerValue">00:00</span>
    </div>

    <!-- Progress -->
    <div class="progress-section">
      <div class="progress-info">
        <span id="progressLabel">Questions Answered: 0 / 0</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
    </div>

    <!-- Question Navigation -->
    <div class="question-nav" id="questionNav" role="tablist" aria-label="Question navigation"></div>

    <!-- Question Panel -->
    <div class="question-panel" id="questionsContainer"></div>

    <!-- Footer -->
    <div class="exam-footer">
      <button id="prevBtn" class="btn btn-outline" onclick="navigateQuestion(-1)" aria-label="Previous question">
        ← Previous
      </button>
      <span id="questionCounter" style="font-size:0.9rem;color:var(--text-secondary);"></span>
      <button id="nextBtn" class="btn btn-outline" onclick="navigateQuestion(1)" aria-label="Next question">
        Next →
      </button>
      <button id="submitBtn" class="btn btn-success btn-lg btn-submit" onclick="showSubmitConfirm()">
        Submit Exam
      </button>
    </div>
    <p class="error" id="examError"></p>
  </div>

  <!-- RESULT SCREEN -->
  <div id="resultScreen" class="hidden card result-card">
    <div class="result-icon success">✓</div>
    <h2>Exam Submitted</h2>
    <div class="score-circle">
      <span class="score-value" id="scoreValue">--</span>
      <span class="score-label" id="scoreLabel">weighted score</span>
    </div>
    <p class="score-breakdown" id="resultText"></p>
    <button class="btn btn-primary btn-lg" onclick="window.location.reload()">Take Another Exam</button>
  </div>

</div>

<!-- SUBMIT CONFIRMATION MODAL -->
<div class="modal-overlay hidden" id="submitModal">
  <div class="modal">
    <h3>Submit Exam?</h3>
    <p>You are about to submit your exam. This action cannot be undone.</p>
    <div class="unanswered-count hidden" id="unansweredBadge">⚠️ 0 questions unanswered</div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="hideSubmitConfirm()">Continue Exam</button>
      <button class="btn btn-danger" id="confirmSubmitBtn" onclick="submitExam()">Submit Now</button>
    </div>
  </div>
</div>

<script type="module" src="/exam/app.js"></script>
</body>
</html>
