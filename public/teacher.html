<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Panel</title>
  <style>
    :root {
      --bg: #f4f7fc;
      --card-bg: white;
      --border: #dce1e8;
      --text: #2c3e50;
      --primary: #3498db;
      --danger: #e74c3c;
      --success: #27ae60;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    h1, h2, h3 { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
    }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .btn-outline { background: white; border: 1px solid var(--primary); color: var(--primary); }

    .exam-list, .question-list, .submission-list {
      list-style: none;
      margin-top: 12px;
    }
    .exam-item, .question-item, .submission-item {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      background: #fafbfc;
    }
    .exam-item:hover, .question-item:hover { background: #f0f3f7; }
    .selected { background: #e8f4fd; border-color: var(--primary); }
    .hidden { display: none; }
    .actions { display: flex; gap: 8px; align-items: center; }
    .badge {
      background: #ddd;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
    }
    .link-box {
      background: #ecf0f1;
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }
    .copy-btn { cursor: pointer; background: none; border: none; color: var(--primary); font-weight: bold; }
    .submission-item { display: flex; justify-content: space-between; }
    .collapse-area { margin-top: 10px; }
    .error { color: red; margin-top: 6px; }
  </style>
</head>
<body>
<div class="container">
  <h1>📚 Teacher Panel</h1>

  <!-- LOGIN/REGISTER (hidden if logged in) -->
  <div id="authSection" class="card">
    <h2 id="authTitle">Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <div class="row">
      <button class="btn-primary" onclick="handleLogin()">Login</button>
      <button class="btn-success" onclick="toggleAuthMode()">Switch to Register</button>
    </div>
    <p id="authError" class="error"></p>
  </div>

  <!-- MAIN PANEL (hidden if not logged in) -->
  <div id="mainPanel" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>Welcome, <span id="displayUsername"></span></h2>
      <button class="btn-danger btn-sm" onclick="logout()">Logout</button>
    </div>

    <!-- CREATE EXAM -->
    <div class="card">
      <h2>Create New Exam</h2>
      <div class="row">
        <div>
          <label>Title</label>
          <input type="text" id="examTitle" placeholder="e.g., Math Quiz">
        </div>
        <div>
          <label>Duration (minutes)</label>
          <input type="number" id="examDuration" min="1" value="30">
        </div>
      </div>
      <div class="row">
        <div><label><input type="checkbox" id="requireName" checked> Require student name</label></div>
        <div><label><input type="checkbox" id="requireId"> Require student ID</label></div>
      </div>
      <button class="btn-primary" onclick="createExam()">Create Exam</button>
      <p id="createMsg" style="margin-top:10px;color:green;"></p>
    </div>

    <!-- EXAM LIST -->
    <div class="card">
      <h2>Your Exams</h2>
      <ul class="exam-list" id="examList"></ul>
      <p id="noExams" class="hidden">No exams yet. Create one above.</p>
    </div>

    <!-- QUESTION MANAGEMENT -->
    <div class="card hidden" id="questionSection">
      <h2>Questions for <span id="selectedExamTitle"></span></h2>
      <div class="link-box" style="margin-bottom: 16px;">
        <span id="examLinkText"></span>
        <button class="copy-btn" onclick="copyExamLink()">📋 Copy</button>
      </div>
      <ul class="question-list" id="questionList"></ul>

      <h3 style="margin-top:20px;">Add Question</h3>
      <input type="text" id="qText" placeholder="Question text">
      <div class="row">
        <input type="text" id="optA" placeholder="Option A">
        <input type="text" id="optB" placeholder="Option B">
      </div>
      <div class="row">
        <input type="text" id="optC" placeholder="Option C">
        <input type="text" id="optD" placeholder="Option D">
      </div>
      <div>
        <label>Correct Option</label>
        <select id="correctOption">
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
        </select>
      </div>
      <button class="btn-success" onclick="addQuestion()">Add Question</button>
      <p id="qMsg" style="margin-top:10px;"></p>
    </div>
  </div>
</div>

<script>
  const API = '/api';
  let token = localStorage.getItem('token');
  let authMode = 'login';
  let selectedExamId = null;

  // Init
  if (token) {
    showMainPanel();
    loadExams();
  } else {
    showAuth();
  }

  function showAuth() {
    document.getElementById('authSection').classList.remove('hidden');
    document.getElementById('mainPanel').classList.add('hidden');
  }

  function showMainPanel() {
    document.getElementById('authSection').classList.add('hidden');
    document.getElementById('mainPanel').classList.remove('hidden');
    const username = localStorage.getItem('username') || 'Teacher';
    document.getElementById('displayUsername').textContent = username;
  }

  function toggleAuthMode() {
    authMode = authMode === 'login' ? 'register' : 'login';
    document.getElementById('authTitle').textContent = authMode === 'login' ? 'Login' : 'Register';
    document.getElementById('authError').textContent = '';
    document.querySelector('#authSection button.btn-success').textContent =
      authMode === 'login' ? 'Switch to Register' : 'Switch to Login';
  }

  async function handleLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('authError');

    if (!username || !password) {
      errorEl.textContent = 'Please fill all fields.';
      return;
    }

    const url = authMode === 'login' ? `${API}/auth/login` : `${API}/auth/register`;
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (!res.ok) {
        errorEl.textContent = data.error || 'Authentication failed';
        return;
      }

      if (authMode === 'login') {
        token = data.token;
        localStorage.setItem('token', token);
        localStorage.setItem('username', username);
        showMainPanel();
        loadExams();
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
      } else {
        // Registration success – switch to login
        authMode = 'login';
        document.getElementById('authTitle').textContent = 'Login';
        document.querySelector('#authSection button.btn-success').textContent = 'Switch to Register';
        errorEl.textContent = 'Registration successful! Please login.';
        errorEl.style.color = 'green';
        document.getElementById('password').value = '';
      }
    } catch (err) {
      errorEl.textContent = 'Network error';
    }
  }

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('username');
    token = null;
    showAuth();
    selectedExamId = null;
    document.getElementById('questionSection').classList.add('hidden');
  }

  // Helper for authenticated fetch
  async function authFetch(url, options = {}) {
    if (!token) throw new Error('Not authenticated');
    const headers = {
      ...options.headers,
      'Authorization': `Bearer ${token}`
    };
    return fetch(url, { ...options, headers });
  }

  // Load all exams
  async function loadExams() {
    try {
      const res = await authFetch(`${API}/exams`);
      if (res.status === 401) { logout(); return; }
      const exams = await res.json();
      const list = document.getElementById('examList');
      const noExams = document.getElementById('noExams');
      list.innerHTML = '';
      if (exams.length === 0) {
        noExams.classList.remove('hidden');
      } else {
        noExams.classList.add('hidden');
        exams.forEach(exam => {
          const li = document.createElement('li');
          li.className = 'exam-item';
          li.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <strong>${exam.title}</strong>
                <span class="badge">${exam.duration_minutes} min</span>
                ${exam.require_name ? ' 👤' : ''}${exam.require_student_id ? ' 🪪' : ''}
                <div class="link-box" style="margin-top:6px;">
                  <span>/exam/${exam.id}</span>
                  <button class="copy-btn" onclick="copyToClipboard('${window.location.origin}/exam/${exam.id}')">📋</button>
                </div>
              </div>
              <div class="actions">
                <button class="btn-outline btn-sm" onclick="toggleSubmissions(${exam.id})">📊 Submissions</button>
                <button class="btn-primary btn-sm" onclick="selectExam(${exam.id})">Manage Questions</button>
                <button class="btn-danger btn-sm" onclick="deleteExam(${exam.id})">Delete</button>
              </div>
            </div>
            <div id="submissions-${exam.id}" class="collapse-area hidden" style="margin-top:12px;"></div>
          `;
          list.appendChild(li);
        });
      }
    } catch (err) {
      console.error(err);
    }
  }

  // Copy exam link
  function copyToClipboard(text) {
    navigator.clipboard.writeText(text)
      .then(() => alert('Link copied!'))
      .catch(() => alert('Failed to copy'));
  }

  // Toggle submissions view for an exam
  async function toggleSubmissions(examId) {
    const container = document.getElementById(`submissions-${examId}`);
    if (container.classList.contains('hidden')) {
      // Load submissions
      try {
        const res = await authFetch(`${API}/exams/${examId}/submissions`);
        if (res.status === 401) { logout(); return; }
        if (!res.ok) {
          container.innerHTML = '<p class="error">Failed to load submissions.</p>';
        } else {
          const subs = await res.json();
          if (subs.length === 0) {
            container.innerHTML = '<p>No submissions yet.</p>';
          } else {
            let html = '<ul class="submission-list">';
            subs.forEach(sub => {
              html += `
                <li class="submission-item">
                  <div>
                    <strong>${sub.student_name || 'Anonymous'}</strong>
                    ${sub.student_id ? `(${sub.student_id})` : ''}
                    <br><small>${new Date(sub.finished_at).toLocaleString()}</small>
                  </div>
                  <div>
                    <span class="badge">${sub.score.toFixed(1)}%</span>
                    <span>${Math.round(sub.score * sub.total_questions / 100)} / ${sub.total_questions}</span>
                  </div>
                </li>
              `;
            });
            html += '</ul>';
            container.innerHTML = html;
          }
        }
      } catch (err) {
        container.innerHTML = '<p class="error">Network error.</p>';
      }
      container.classList.remove('hidden');
    } else {
      container.classList.add('hidden');
    }
  }

  // Create a new exam
  async function createExam() {
    const title = document.getElementById('examTitle').value.trim();
    const duration = parseInt(document.getElementById('examDuration').value);
    const require_name = document.getElementById('requireName').checked;
    const require_student_id = document.getElementById('requireId').checked;
    const msg = document.getElementById('createMsg');

    if (!title || !duration) {
      msg.textContent = '❌ Title and duration are required.';
      msg.style.color = 'red';
      return;
    }

    try {
      const res = await authFetch(`${API}/exams`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, duration_minutes: duration, require_name, require_student_id })
      });
      if (res.ok) {
        msg.textContent = '✅ Exam created!';
        msg.style.color = 'green';
        document.getElementById('examTitle').value = '';
        document.getElementById('examDuration').value = 30;
        loadExams();
      } else if (res.status === 401) { logout(); }
      else {
        const err = await res.json();
        msg.textContent = '❌ ' + (err.error || 'Failed');
        msg.style.color = 'red';
      }
    } catch (err) {
      msg.textContent = '❌ Network error';
    }
  }

  // Select exam for question management
  async function selectExam(id) {
    selectedExamId = id;
    loadExams(); // refresh list (for selection styles if needed)
    document.getElementById('questionSection').classList.remove('hidden');

    try {
      const res = await authFetch(`${API}/exams/${id}`);
      if (res.status === 401) { logout(); return; }
      const exam = await res.json();
      document.getElementById('selectedExamTitle').textContent = exam.title;
      document.getElementById('examLinkText').textContent = `${window.location.origin}/exam/${exam.id}`;
      renderQuestions(exam.questions);
    } catch (err) {
      console.error(err);
    }
  }

  // Render questions list
  function renderQuestions(questions) {
    const list = document.getElementById('questionList');
    list.innerHTML = '';
    questions.forEach(q => {
      const li = document.createElement('li');
      li.className = 'question-item';
      li.innerHTML = `
        <div style="display:flex; justify-content:space-between;">
          <div>
            <strong>${q.text}</strong><br>
            <small>A: ${q.option_a} | B: ${q.option_b} | C: ${q.option_c} | D: ${q.option_d}</small>
            <span class="badge">Correct: ${q.correct_option}</span>
          </div>
          <button class="btn-danger btn-sm" onclick="deleteQuestion(${q.id})">Delete</button>
        </div>
      `;
      list.appendChild(li);
    });
  }

  // Add a question
  async function addQuestion() {
    if (!selectedExamId) return;
    const text = document.getElementById('qText').value.trim();
    const option_a = document.getElementById('optA').value.trim();
    const option_b = document.getElementById('optB').value.trim();
    const option_c = document.getElementById('optC').value.trim();
    const option_d = document.getElementById('optD').value.trim();
    const correct_option = document.getElementById('correctOption').value;
    const msg = document.getElementById('qMsg');

    if (!text || !option_a || !option_b || !option_c || !option_d) {
      msg.textContent = '❌ All fields are required.';
      msg.style.color = 'red';
      return;
    }

    try {
      const res = await authFetch(`${API}/exams/${selectedExamId}/questions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, option_a, option_b, option_c, option_d, correct_option })
      });
      if (res.ok) {
        msg.textContent = '✅ Question added!';
        msg.style.color = 'green';
        document.getElementById('qText').value = '';
        document.getElementById('optA').value = '';
        document.getElementById('optB').value = '';
        document.getElementById('optC').value = '';
        document.getElementById('optD').value = '';
        selectExam(selectedExamId);
      } else if (res.status === 401) { logout(); }
      else {
        const err = await res.json();
        msg.textContent = '❌ ' + (err.error || 'Failed');
        msg.style.color = 'red';
      }
    } catch (err) {
      msg.textContent = '❌ Network error';
    }
  }

  // Delete an exam
  async function deleteExam(id) {
    if (!confirm('Delete this exam and all its questions/submissions?')) return;
    try {
      const res = await authFetch(`${API}/exams/${id}`, { method: 'DELETE' });
      if (res.status === 401) { logout(); return; }
      if (selectedExamId === id) {
        selectedExamId = null;
        document.getElementById('questionSection').classList.add('hidden');
      }
      loadExams();
    } catch (err) {
      console.error(err);
    }
  }

  // Delete a question
  async function deleteQuestion(qId) {
    if (!confirm('Delete this question?')) return;
    try {
      const res = await authFetch(`${API}/questions/${qId}`, { method: 'DELETE' });
      if (res.status === 401) { logout(); return; }
      selectExam(selectedExamId);
    } catch (err) {
      console.error(err);
    }
  }
</script>
</body>
</html>
